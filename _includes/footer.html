{%- assign current_lang = page.lang | default: 'en' -%}
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-ack">{{ site.data[current_lang].footer.acknowledgement }}</p>
    <p class="footer-meta">
      &copy; <span id="year"></span> {{ site.title }}. {{ site.data[current_lang].footer.copyright_line }}
      <span class="footer-sep" aria-hidden="true">|</span>
      <a href="{% if current_lang == 'zh' %}{{ site.baseurl }}/zh/privacy{% else %}{{ site.baseurl }}/privacy{% endif %}">{{ site.data[current_lang].footer.privacy_policy }}</a>
    </p>
  </div>
</footer>
