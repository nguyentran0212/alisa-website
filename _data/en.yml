sections:

  what_is_play_therapy:
    eyebrow: "Play Therapy"
    title: "What is Play Therapy?"
    # Para 1 sets up the problem. Para 2 is the pull-out thesis line
    # (rendered larger/italic via .standfirst). <hr> separates the
    # standfirst from the definition paragraphs that follow.
    body_html: |
      <p>Young children often do not have the words to explain what they are feeling or experiencing. When feelings are big, finding those words can be even harder. What they cannot yet put into words may sometimes show up in how they behave or relate to others.</p>

      <p class="standfirst">Play gives children a natural way to express and explore what they may not yet be able to say.</p>

      <p>Play Therapy is a therapeutic approach where children use toys, creative materials, and play to express feelings, explore thoughts and experiences they may be finding difficult, and make sense of their world. Within a safe, accepting therapeutic relationship, often built through regular sessions over time, they are supported to express themselves in their own way and at their own pace.</p>

      <p>Over time, this process can support children to better understand and manage their emotions, strengthen relationships, and develop trust in their ability to cope with life&rsquo;s challenges.</p>

  is_this_for_my_child:
    eyebrow: ""
    title: "Play Therapy supports children who are navigating:"
    items:
      - title: "Big Emotions and Meltdowns"
        body: "Frequent tantrums, emotional outbursts, or difficulty calming down."
      - title: "Behavioural Challenges"
        body: "Aggression, defiance, withdrawal, or struggles with everyday routines."
      - title: "Play and Social Difficulties"
        body: "Struggles with play skills, joining in with peers, making friends, or feeling confident in social situations."
      - title: "Anxiety, Worries, or Big Life Changes"
        body: "Worries, clinginess, withdrawal, or difficulty adjusting to changes such as starting school, family changes, or loss."
    cta: "Find out More"
    cta_url: "/2026/07/02/is-play-therapy-right-for-my-child.html"

