  about:
    eyebrow: "About Alisa"
    title: "About Alisa"
    bio_html: >
      <p>I am a play therapist and early childhood teacher, originally from China. I came to Australia in 2015 to study Teaching, and since then my work has centred around young children aged 3-8.</p>
      <p>I believe children grow and heal within relationships where they feel safe, accepted, and genuinely understood. Through a warm and supportive therapeutic relationship, I provide children with a space where they can express themselves, explore their experiences, and discover their own strengths at their own pace.</p>
    credentials: "Master of Play Therapy · Master of Teaching (Early Childhood) / Registered Play Therapist (APPTA & PTPA) · Registered Teacher, Early Childhood (SA)"
    cta: "Read More About Me"
    cta_url: "/about"

  faq:
    eyebrow: "You Might Wonder"
    title: "Frequently Asked Questions"
    lead: "More questions? Get in touch."
    lead_url: "#contact"
    items:
      - q: "How does the process look like?"
        # Q1's answer contains the 4-step process (intake / sessions / reviews / ending).
        # Rendered as HTML so the <ol> shows.
        a_html: >
          <p>The process usually happens in four steps:</p>
          <ol>
            <li><strong>Intake consultation</strong> — a one-off 90-minute meeting to talk through your child's history, your concerns, and what you're hoping for from therapy.</li>
            <li><strong>Regular therapy sessions</strong> — usually weekly, around one hour each. Children do best when therapy is predictable and consistent, and weekly rhythm gives that.</li>
            <li><strong>Parent review meetings</strong> — regular check-ins (every 5 or 6 sessions) to talk about progress and adjust the plan if needed. You're part of the process, not on the outside of it.</li>
            <li><strong>Ending therapy</strong> — when your child is ready, we plan the ending together. Countdown sessions will be discussed and arranged ahead rather than stopping suddenly, so your child has time to adjust.</li>
          </ol>
      - q: "Does my child need a diagnosis or referral?"
        a: "Not really. If you have concerns about your child's emotions, behaviour, or social development, feel free to reach out."
      - q: "Where do sessions happen?"
        a: "Sessions are mobile across Metropolitan Adelaide, which means I come to your child. Most often this is your home, where your child is already comfortable. By arrangement, sessions can be held at your child's childcare or school. Parent consultations and parent-child sessions (filial therapy) are held online."
      - q: "How long does therapy take?"
        a: "Most children are in therapy for around 20 sessions. Some settle faster. Some need longer, especially when the difficulties are deeper or have been going on for a while. Progress is reviewed with you regularly. You're not committing to a fixed length of time. You're committing to a process, and we keep checking in together about how it's going."
      - q: "Do I stay in the room during sessions?"
        a: "Whether you stay in the playroom or not, and for how long, depends on your child's needs. Generally, parents are not in the play space during sessions. This matters more than it sounds. Children express themselves differently when the relational dynamics of home aren't in the room. The play space becomes a different kind of space, and that difference is part of what makes the work possible. Some children need a gentler start. If your child is very young, new to therapy, or finding it hard to settle, we can plan for you to be nearby at first and step out gradually. Occasionally, your child may need you to stay in the playroom for a few minutes as a transition. Whatever we decide, it's about attuning to what your child needs in that moment, and we work it out together."
      - q: "When are sessions available?"
        a: "Sessions are available on Wednesdays and Fridays, between 8:30am and 5pm."
