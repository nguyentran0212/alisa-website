sections:
  approach:
    eyebrow: "Our Approach"
    title: "Supportive, holistic, child-centred"
    lead: "Three principles shape every session — and the relationship we build with you and your child."
    pillars:
      - title: "Child-led"
        body: "Your child chooses what to play with and how. We follow their lead so the work happens at their pace, in their language — the one they already speak fluently."
      - title: "Trauma-informed"
        body: "We understand how big feelings, transitions and stress show up in play and behaviour. The playroom is built to feel safe enough for all of them."
      - title: "Family-connected"
        body: "Parents are part of the work. We meet with you regularly, share what we're noticing, and help you carry the approach into the rest of your child's week."

  services:
    eyebrow: "What I Offer"
    title: "Services"
    lead: "Three approaches I draw on depending on what your child needs. Tap a card to read more."
    items:
      - title: "Learn to Play Therapy"
        sub: "Building pretend play skills"
        lead: "For children who haven't yet developed the kind of pretend play that comes naturally to many of their peers."
        body: "Some children find pretend play difficult. They may get frustrated during play, or lose interest quickly. Learn to Play Therapy focuses on six core pretend-play skills and is particularly helpful for children experiencing speech or language delays, autism, or social communication differences."
        list_intro: "It may help if your child:"
        list:
          - "Struggles with imaginative play"
          - "Has speech or language delays"
          - "Finds peer play hard to follow or join"
          - "Has been described as 'playing alone' or 'on the edges'"

      - title: "Child-Centred Play Therapy"
        sub: "A developmental counselling approach"
        lead: "A non-directive, child-led space for children aged 3–8 to process feelings and develop new coping skills through play."
        body: "In the playroom your child chooses what to do and how. We provide a warm, accepting relationship and a carefully chosen set of toys that express a wide range of feelings. Over time, children begin to use the room to work through what's on their mind."
        list_intro: "It may help if your child is experiencing:"
        list:
          - "Big feelings that feel overwhelming"
          - "Anxiety, low mood, or withdrawal"
          - "Family changes — separation, a new sibling, a move"
          - "Grief or loss"
          - "Difficulty making or keeping friends"

      - title: "Filial Therapy"
        sub: "Parent–child play sessions at home"
        lead: "A short training so you can run 30-minute therapeutic play sessions with your child at home, supported by me."
        body: "Filial Therapy recognises that parents are the most important people in a child's life. After a short training (usually weekly for several weeks), you run structured play sessions at home while I support you in supervision. Many families describe it as the most connecting thing they've done with their child."
        list_intro: "Families often tell me:"
        list:
          - "They understand their child in a new way"
          - "Behaviour that's been stuck begins to shift"
          - "Daily routines feel calmer"
          - "They feel more confident as a parent"

  process:
    eyebrow: "The Process"
    title: "What to expect"
    lead: "Four steps from first contact to the first review. Most of the work happens in the playroom — these are the shape of how we get there."
    steps:
      - title: "Get in Touch"
        body: "Fill in the enquiry form below. I'll reply within three business days with a time for a free 15-minute phone call."
      - title: "Parent Intake"
        body: "We meet at the playroom without your child to talk through their history and your hopes. Allow about 90 minutes."
      - title: "Sessions Begin"
        body: "Your child attends weekly. The first three or four sessions focus on building trust and getting a clear picture of what they need."
      - title: "Parent Review"
        body: "After three or four sessions we meet again to share what we've noticed and set goals together. Reviews continue every five weeks."

  about:
    eyebrow: "Meet Alisa"
    title: "Alisa Liao — Registered Play Therapist"
    bio_html: >
      <p>Alisa is a Registered Play Therapist supporting children aged 3–8 and their families across Metropolitan Adelaide and via telehealth. She trained at the University of South Australia and is a member of the Australasia Pacific Play Therapy Association (APPTA) and the Play Therapy Practitioners Association (PTPA).</p>
      <p>Before opening her practice, Alisa spent several years working in child and family services, supporting families through big transitions and the everyday challenges of raising small people. She brings that grounding — practical, warm, never performative — into every playroom session.</p>
    credentials_title: "Qualifications & Registration"
    credentials:
      - what: "Graduate Diploma in Child Play Therapy"
        where: "University of South Australia"
      - what: "Bachelor of Social Work"
        where: "University of Adelaide"
      - what: "Member, Australasia Pacific Play Therapy Association (APPTA)"
      - what: "Member, Play Therapy Practitioners Association (PTPA)"
      - what: "Registered with the Australian Association of Social Workers"

  faq:
    eyebrow: "Common Questions"
    title: "FAQ"
    lead: "A few of the things parents most often ask. If yours isn't here, send it through with the enquiry form and I'll answer when I reply."
    items:
      - q: "What is Play Therapy?"
        a_html: >
          <p>Play Therapy is a developmentally informed counselling approach that uses a child's natural language — play — to help them process feelings, build skills, and work through difficult experiences.</p>
          <p>Children don't need words for everything. A trained play therapist can read what your child is telling them through the way they play, and use that to support them.</p>
      - q: "How long does my child need to attend?"
        a: "Most children attend weekly for around 12–20 sessions. We'll have a clearer picture after the first review at session 4."
      - q: "Do you offer telehealth?"
        a: "Yes — for parent consultations and Filial Therapy. Child sessions are in person because so much of the work happens through the toys and the playroom itself."
      - q: "What ages do you work with?"
        a: "Children aged 3–8. Some approaches work outside this range; if your child is older, send me a message and we can talk about whether we're the right fit."
      - q: "Do you take NDIS clients?"
        a: "Yes — both self-managed and plan-managed. Play Therapy can be claimed under Capacity Building — Improved Daily Living."
      - q: "What if my child doesn't want to come?"
        a: "That's very common at first, and usually settles after a few sessions. We'll talk through anything that comes up at the parent review."

