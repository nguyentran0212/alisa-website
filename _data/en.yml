  about:
    eyebrow: "About"
    title: "Meet Alisa"
    bio_html: >
      <p>I am a play therapist and early childhood teacher, originally from China. I came to Australia in 2015 to study Teaching and have since spent my career supporting young children aged 3–8 and their families.</p>
      <p>I believe children grow within relationships where they feel safe, accepted, and genuinely understood. I provide a warm and supportive space where children can express themselves, explore their experiences, and discover their own strengths at their own pace.</p>
    credentials: "Master of Play Therapy · Master of Teaching (Early Childhood) / Registered Play Therapist (APPTA & PTPA) · Registered Teacher, Early Childhood (SA)"
    cta: "More about Alisa"
    cta_url: "/about"

  faq:
    eyebrow: "You Might Wonder"
    title: "Frequently Asked Questions"
    lead: "More questions? Get in touch."
    lead_url: "#contact"
    items:
      - q: "How does the process look like?"
        # Q1's answer contains the 4-step process (intake / sessions / reviews / ending).
        # Rendered as HTML so the <ol> shows.
        a_html: >
          <p>The process usually happens in four steps:</p>
          <ol>
            <li><strong>Intake consultation</strong> — a one-off 90-minute meeting to talk through your child's history, your concerns, and what you're hoping for from therapy.</li>
            <li><strong>Regular therapy sessions</strong> — usually weekly, around one hour each. Children do best when therapy is predictable and consistent, and weekly rhythm gives that.</li>
            <li><strong>Parent review meetings</strong> — regular check-ins (every 5 sessions) to talk about progress and adjust the plan if needed. You're part of the process, not on the outside of it.</li>
            <li><strong>Ending therapy</strong> — The length of therapy varies depending on the child's needs and progress. When your child is ready, we plan the ending together. Countdown sessions will be discussed and arranged ahead rather than stopping suddenly, so your child has time to adjust.</li>
          </ol>
      - q: "Fees"
        # Two columns (Private Paying / NDIS) with sage-tinted panels.
        # Closed by default — opens on click like every other FAQ item.
        a_html: >
          <div class="fees-faq-grid">
            <div class="fees-faq-panel">
              <h4 class="fees-faq-panel-title">Private Paying clients</h4>
              <div class="fee-line">
                <span class="fee-line-name">Intake consultation (one-off, 90 minutes)</span>
                <span class="fee-line-price">$255</span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">Therapy session</span>
                <span class="fee-line-price">$170<span class="fee-line-unit">/h</span></span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">Parent Review Meetings</span>
                <span class="fee-line-price">$170<span class="fee-line-unit">/h</span></span>
              </div>
            </div>
            <div class="fees-faq-panel">
              <h4 class="fees-faq-panel-title">NDIS clients</h4>
              <div class="fee-line">
                <span class="fee-line-name">Intake consultation (one-off, 90 minutes)</span>
                <span class="fee-line-price">$290.98</span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">Therapy session</span>
                <span class="fee-line-price">$193.99<span class="fee-line-unit">/h</span></span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">Parent Review Meetings</span>
                <span class="fee-line-price">$193.99<span class="fee-line-unit">/h</span></span>
              </div>
            </div>
          </div>
          <p class="fees-faq-note">For children seen in their home or school environment, travel charges may apply. We will always confirm and agree on travel costs before commencing mobile sessions.</p>
          <p class="fees-faq-disclaimer"><em>Fees are subject to review on 1 July, 2027.</em></p>
      - q: "Does my child need a diagnosis or referral?"
        a: "Not really. If you have concerns about your child's emotions, behaviour, or social development, feel free to reach out."
      - q: "What to expect in a session?"
        a_html: >
          <p>A play therapy session may look like play, but there is purpose behind it.</p>
          <p>Sessions are child-led, which means your child has space to choose how they would like to play, explore and express themselves. I follow their lead, while thoughtfully responding to what unfolds in the play and in our relationship.</p>
          <p>There are no worksheets, tests or expectations to talk about difficult experiences. Your child does not need to have the words to explain what is going on.</p>
          <p>Sometimes there may be lots of movement, creativity and laughter. Other times, a child may be quiet, unsure or simply watch and take their time. All of these are okay. The session begins with where your child is on that day.</p>
      - q: "Where do sessions happen?"
        a: "Sessions are mobile across Metropolitan Adelaide, which means I come to your child. By arrangement, sessions can be held at Home, your child's childcare or school. Parent consultations and parent-child sessions (filial therapy) are held online."
      - q: "When are sessions available?"
        a: "Sessions are available on Wednesdays and Fridays, between 8:30am and 5pm."
