        price: "$180"
        unit: "per session"
      - name: "Parent Review Meeting"
        detail: "50 minutes, held without your child every five weeks."
        price: "$180"
        unit: "per session"
      - name: "Filial Therapy Training"
        detail: "Weekly parent training sessions, six per course."
        price: "$180"
        unit: "per session"
      - name: "Community Observation"
        detail: "At kindergarten, school or early learning. Travel may incur an extra fee."
        price: "On application"
      - name: "Reports and Letters"
        detail: "Including NDIS progress reports. Tailored to your needs."
        price: "On application"

