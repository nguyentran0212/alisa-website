          <div class="fees-faq-grid">
            <div class="fees-faq-panel">
              <h4 class="fees-faq-panel-title">自费客户</h4>
              <div class="fee-line">
                <span class="fee-line-name">初次咨询（一次性，90分钟）</span>
                <span class="fee-line-price">$255</span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">游戏治疗</span>
                <span class="fee-line-price">$170<span class="fee-line-unit">/小时</span></span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">家长回顾会议</span>
                <span class="fee-line-price">$170<span class="fee-line-unit">/小时</span></span>
              </div>
            </div>
            <div class="fees-faq-panel">
              <h4 class="fees-faq-panel-title">NDIS 客户</h4>
              <div class="fee-line">
                <span class="fee-line-name">初次咨询（一次性，90分钟）</span>
                <span class="fee-line-price">$290.98</span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">游戏治疗</span>
                <span class="fee-line-price">$193.99<span class="fee-line-unit">/小时</span></span>
              </div>
              <div class="fee-line">
                <span class="fee-line-name">家长回顾会议</span>
                <span class="fee-line-price">$193.99<span class="fee-line-unit">/小时</span></span>
              </div>
            </div>
          </div>
          <p class="fees-faq-note">上门服务（家中或学校）可能会收取出行费用。</p>
          <p class="fees-faq-disclaimer"><em>费用会在 2027 年 7 月做一次调整。如果有变化，您会提前收到通知。</em></p>
      - q: "来之前，孩子需要先被诊断或确诊吗？"
        a: "不需要。如果您对孩子的情绪、行为或社交发展有担忧，欢迎随时联系我。"
      - q: "一次治疗是什么样子的？"
        a_html: >
          <p>一次游戏治疗看起来像在玩，但背后是有目的的。</p>
          <p>游戏治疗是由孩子主导的——孩子可以选择怎么玩、怎么探索、怎么表达。我会跟随他们，同时用心去回应游戏和关系中浮现的一切。</p>
          <p>这里没有作业、没有测试，也不需要讲述那些困难的事情。孩子不需要用语言来解释发生了什么。</p>
          <p>有时游戏室里会有很多动作、创造和笑声；有时孩子可能很安静、不太确定，或者只是在一旁观察、慢慢来。这些都没关系。治疗从孩子当天的状态开始。</p>
      - q: "游戏治疗在哪里进行？"
        a: "提供上门服务，覆盖阿德莱德市区及周边。也可以协商在家中、托儿所或学校开展。亲子咨询和亲子游戏治疗在线上进行。"
      - q: "治疗什么时候可以预约？"
        a: "目前，游戏治疗在周三和周五开放，时间为上午8点30分至下午5点。"
