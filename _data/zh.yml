sections:

  what_is_play_therapy:
    eyebrow: "游戏治疗"
    title: "什么是游戏治疗？"
    body_html: |
      <p>年幼的孩子往往还没有足够的语言，去说清自己的感受或经历。情绪越是激烈，找到合适的语言就越难。那些还无法用语言表达的东西，有时会通过他们的行为、或与他人相处的方式，慢慢显现出来。</p>

      <p class="standfirst">游戏，为孩子提供了一种自然而然的途径，去表达和探索那些他们还说不出口的内心世界。</p>

      <p>游戏治疗是一种心理治疗方法。让孩子通过玩具、各种创作材料和游戏，去表达情绪、探索那些觉得难以言说的想法和经历，并慢慢理解自己所在的世界。</p>

      <p>在一段安全、被接纳的治疗关系中——这种关系往往需要通过定期的、持续的面谈慢慢建立——孩子可以按自己的方式、自己的节奏，慢慢敞开来表达自己。</p>

      <p>随着时间推移，这个过程可以帮助孩子更好地觉察和调节情绪、建立自信、巩固关系，并逐渐相信自己——相信自己有力量去面对生活中的挑战。</p>

  is_this_for_my_child:
    eyebrow: ""
    title: "游戏治疗帮助正在面对以下情况的孩子："
    items:
      - title: "情绪波动大，难以平静下来"
        body: "情绪来得强烈或变化较快，容易大哭，情绪激动时很难自己平复，或者需要较长时间才能恢复平静。"
      - title: "行为上的挑战"
        body: "容易抗拒或不愿配合日常安排，遇到困难时容易退缩，或者会通过摔东西、打人等行为表达自己的情绪和需要。"
      - title: "玩耍和社交中的困难"
        body: "不太知道如何开始或延续游戏，难以加入同伴的游戏，交朋友有些困难，或在社交场合中容易感到不自在。"
      - title: "焦虑、担忧或正在经历生活变化"
        body: "表现出担忧、过度黏人、沉默或退缩，或者在面对新的环境或生活变化时难以适应，例如开始上学、家庭结构变化、搬家或失去亲人。"
    cta: "了解更多"
    cta_url: "/zh/blog/is-play-therapy-right-for-my-child/"

  services:
    eyebrow: "提供的服务"
    title: "服务项目"
    lead: "我提供三种游戏治疗方法，支持儿童和家庭。"
    items:
      - title: "以儿童为中心的游戏治疗"
        sub: "一个孩子可以慢慢长大的情绪空间。"
        lead: '在这里，孩子不需要变成“更好的孩子”，只需要做自己。'
        body: "他们按自己的节奏，在游戏中被稳稳接住——慢慢地，长出更稳的情绪、更强的自信、面对生活的力量。"
        cta: "阅读更多"
        cta_url: "/zh/blog/what-is-child-centered-play-therapy/"
      - title: "Learn to Play 游戏治疗"
        sub: "孩子还没学会玩？不是不想，是还没找到方式。"
        lead: "有些孩子还不太会主动玩、不知道怎么加入同伴，或跟别人一起专注地玩。"
        body: "在治疗师的陪伴下，孩子一步步建立起玩耍的能力——从独自探索，到与他人建立联系。"
        cta: "阅读更多"
        cta_url: "/zh/blog/what-is-learn-to-play-therapy/"
      - title: "亲子游戏治疗"
        sub: "父母走进孩子内心，增进亲子关系。"
        lead: "一种父母与孩子共同参与的方式——父母学习游戏治疗技能，支持孩子的身心健康，并加深亲子之间的联结。"
        body: "在日常的每一个互动里，建立起更稳固、更亲密的联结。"
        cta: "阅读更多"
        cta_url: "/zh/blog/what-is-filial-therapy/"

  about:
    eyebrow: "关于"
    title: "认识 Alisa"
    bio_html: >
      <p>我是一名游戏治疗师，也是一名早教老师——来自中国。2015 年来到澳洲学习早教，此后整个职业生涯都在陪伴 3-8 岁的孩子与他们的家庭。</p>
      <p>我相信，孩子在安全、被接纳、被真正理解的关系中成长。我营造一个温暖、有支持的环境，让孩子能表达自己、探索自己的经历，并按自己的节奏慢慢发现自己内在的力量。</p>
    credentials: "游戏治疗硕士 · 教育学硕士（幼儿方向） / 注册游戏治疗师（APPTA & PTPA） · 注册幼教（南澳大利亚）"
    cta: "阅读完整简介"
    cta_url: "/zh/about"

  faq:
    eyebrow: "您可能想知道"
    title: "常见问题"
    lead: "还有更多问题？欢迎联系我"
    lead_url: "#contact"
    items:
      - q: "治疗流程是怎样的？"
        a_html: >
          <p>整个治疗通常分为四个步骤：</p>
          <ol>
            <li><strong>初次咨询</strong> —— 一次 90 分钟的会谈。我们会一起梳理孩子的成长经历，您关心的方向，以及您希望通过治疗达成的目标。</li>
            <li><strong>常规治疗</strong> —— 通常每周一次，每次一小时。稳定、可预期的节奏，对孩子最有帮助。</li>
            <li><strong>家长回顾会</strong> —— 每做完 5 次治疗后，我们会安排一次回顾，一起看看孩子的进展、聊聊下一步的方向。您不是旁观者——治疗不只是孩子的事，也是您和孩子一起经历的过程。</li>
            <li><strong>结案</strong> —— 治疗的时间长短取决于孩子的需求和进展。当孩子准备好的时候，我们会一起商量结束的方式。通过最后的几次治疗，给孩子足够的时间去适应和告别。</li>
          </ol>
      - q: "费用"
        # 双栏（自费 / NDIS），薄荷绿面板。
        # 默认折叠，和其他 FAQ 条目一样点击展开。
