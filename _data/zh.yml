  about:
    eyebrow: "认识 Alisa"
    title: "关于 Alisa"
    bio_html: >
      <p>我是一名游戏治疗师，也是一名早教老师——来自中国，在澳大利亚生活和工作。2015 年我来到澳洲读早教，之后一直从事幼儿教育的工作。十年来，我的工作一直围绕着 3-8 岁的孩子。</p>
      <p>我相信，孩子在关系中成长，也在关系中被疗愈。当一个孩子感受到安全、被接纳、被真诚地理解，他就能慢慢找到属于自己的力量。在温暖、稳当的治疗关系里，我给孩子一个空间——去表达、去探索，按自己的节奏，长出属于自己的力量。</p>
    credentials: "游戏治疗硕士 · 教育学硕士（幼儿方向） / 注册游戏治疗师（APPTA & PTPA） · 注册幼教（南澳大利亚）"
    cta: "阅读完整简介"
    cta_url: "/zh/about"

  faq:
    eyebrow: "您可能想知道"
    title: "常见问题"
    lead: "还有更多问题？欢迎联系我"
    lead_url: "#contact"
    items:
      - q: "治疗流程是怎样的？"
        a_html: >
          <p>整个治疗通常分为四个步骤：</p>
          <ol>
            <li><strong>初次咨询</strong> —— 一次 90 分钟的会谈。我们会一起梳理孩子的成长经历，您关心的方向，以及您希望通过治疗达成的目标。</li>
            <li><strong>常规治疗</strong> —— 通常每周一次，每次一小时。稳定、可预期的节奏，对孩子最有帮助。</li>
            <li><strong>家长回顾会</strong> —— 每做完 5–6 次治疗后，我们会安排一次回顾，一起看看孩子的进展、聊聊下一步的方向。您不是旁观者——治疗不只是孩子的事，也是您和孩子一起经历的过程。</li>
            <li><strong>结案</strong> —— 当孩子准备好的时候，我们会一起商量结束的方式。通过最后的几次治疗，给孩子足够的时间去适应和告别。</li>
          </ol>
      - q: "来之前，孩子需要先被诊断或确诊吗？"
        a: "不需要。如果您对孩子的情绪、行为或社交发展有担忧，欢迎随时联系我。"
      - q: "游戏治疗在哪里进行？"
        a: "提供上门服务，覆盖阿德莱德市区及周边。游戏治疗通常在您家中进行——熟悉的环境能让孩子更放松。也可以协商在托儿所或学校开展。亲子咨询和亲子游戏治疗在线上进行。"
      - q: "治疗需要多长时间？"
        a: "这没有一个标准答案——每个孩子都不一样。大多数孩子需要 20 次左右的治疗。有些孩子更快，有些孩子需要更久，尤其是当困扰已经持续了相当一段时间的时候。我会和你一起定期回顾进展。我们会边走、边看、边调整。"
      - q: "孩子进行游戏治疗时，父母需要在场吗？"
        a: '大多数时候，父母是不在游戏室的——当家里那种亲子关系的张力暂时不在场，孩子通常会把平时觉得难以显露的那一面展现出来。游戏室成了一个不同的空间，而这种“不同”，正是变化能发生的地方。每个孩子的节奏不一样。如果孩子还小、刚开始接触治疗、或者一离开你就容易焦虑，我们可以从你在游戏室里陪一段开始，慢慢退出。偶尔，孩子可能需要你陪几分钟作为过渡。'
      - q: "治疗什么时候可以预约？"
        a: "目前，游戏治疗在周三和周五开放，时间为上午8点30分至下午5点。"

