sections:

  what_is_play_therapy:
    eyebrow: "了解游戏治疗"
    title: "什么是游戏治疗？"
    body_html: >
      <p>你有没有过这种时刻——把一件压在心底的事，说给一个愿意倾听、能够懂你的人。对方可能不会急着给你建议或者帮你"解决"，只是陪着你、留出空间，让你的感受被看见、被接纳。说出口后，你会觉得轻了一些。问题或许还在，但你不再是一个人扛着。当我们感到被接纳、被理解，往往会慢慢生出勇气，找到适合自己的方式往前走。</p>

      <p>孩子也一样需要这样的体验。只是他们还说不清自己的感受、经历和心事。<strong>所以，他们用自己最熟悉的方式——玩——来表达自己。</strong></p>

      <blockquote><strong>游戏是孩子的语言，玩具是他们的词汇。</strong> — Garry Landreth</blockquote>

      <p>游戏治疗，是一种儿童心理咨询方式。它尊重游戏作为孩子与生俱来的语言——孩子用它来表达、探索、理解自己的世界。在一个安全、被全然接纳的治疗关系里，孩子借助玩具、玩偶、木偶、颜料和各种创意活动，去诉说那些可能太复杂、太混乱、太沉重而难以用语言表达的感受。</p>

      <p>慢慢地，这个过程会帮孩子长出<strong>更强的情绪觉察，学会和情绪相处，建立起更多的自信，也更踏实地相信自己——相信自己有力量面对生活中的挑战。</strong></p>

  is_this_for_my_child:
    eyebrow: ""
    title: "游戏治疗帮助正在面对以下情况的孩子："
    items:
      - title: "情绪波动大，难以平静下来"
        body: "情绪来得强烈或变化较快，容易大哭，情绪激动时很难自己平复，或者需要较长时间才能恢复平静。"
      - title: "行为上的挑战"
        body: "容易抗拒或不愿配合日常安排，遇到困难时容易退缩，或者会通过摔东西、打人等行为表达自己的情绪和需要。"
      - title: "玩耍和社交中的困难"
        body: "不太知道如何开始或延续游戏，难以加入同伴的游戏，交朋友有些困难，或在社交场合中容易感到不自在。"
      - title: "焦虑、担忧或正在经历生活变化"
        body: "表现出担忧、过度黏人、沉默或退缩，或者在面对新的环境或生活变化时难以适应，例如开始上学、家庭结构变化、搬家或失去亲人。"
    cta: "了解更多"
    cta_url: "/zh/blog/is-play-therapy-right-for-my-child/"

