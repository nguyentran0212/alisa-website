hero:
  eyebrow: "阿德莱德 · 线上治疗"
  title: "在游戏中，遇见孩子"
  title_accent: "游戏"
  subtitle: "为3-8岁的孩子与家庭提供游戏治疗支持。在游戏中，帮助孩子学会调节情绪、建立自信、掌握社交技巧，并与父母一起建立更安全、更温暖的亲子联结。"
  cta_primary: "预约15分钟免费咨询"
  cta_secondary: "了解游戏治疗"

sections:
  approach:
    eyebrow: "我的方法"
    title: "支持性的 · 全人的 · 以孩子为中心的"
    lead: "三个原则贯穿每一次治疗，也贯穿我们与您和孩子建立的关系。"
    pillars:
      - title: "以孩子为主导"
        body: "由您的孩子选择玩什么、怎么玩。我们跟随他们的节奏，让工作以他们已经熟稔的语言——游戏——自然发生。"
      - title: "理解创伤"
        body: "我们理解强烈的情绪、过渡期与压力如何在游戏和行为中表现出来。游戏室被营造为足够安全的空间，去容纳这一切。"
      - title: "与家庭联结"
        body: "父母是治疗工作的重要部分。我们定期与您会面，分享观察到的内容，并帮助您把这种方法带入孩子一周的其他时间。"

  services:
    eyebrow: "我提供的服务"
    title: "服务项目"
    lead: "根据孩子的需要，我会在三种方法之间灵活切换。点击卡片查看详情。"
    items:
      - title: "学会游戏治疗 (Learn to Play)"
        sub: "建立假想游戏的能力"
        lead: "针对尚未自然发展出假想游戏能力的儿童。"
        body: "有些孩子在假想游戏中会遇到困难——容易感到挫败，或很快失去兴趣。学会游戏治疗关注六项核心假想游戏技能，对存在言语/语言发育迟缓、自闭症谱系或社交沟通差异的儿童尤其有帮助。"
        list_intro: "在以下情况下可能会有帮助："
        list:
          - "在假想游戏方面有困难"
          - "存在言语或语言发育迟缓"
          - "难以跟随或加入同伴的游戏"
          - "常被描述为'独自玩耍'或'在边缘观察'"

      - title: "以儿童为中心的游戏治疗"
        sub: "一种发展性的心理咨询方式"
        lead: "为3-8岁儿童提供的非指导式、以儿童为主导的空间，让他们通过游戏处理情绪、学习新的应对方式。"
        body: "在游戏室里，您的孩子选择做什么、怎么做。我们提供温暖、接纳的关系和一套精心挑选的、能表达广泛情绪的玩具。随着时间推移，孩子会开始用这个空间来处理他们心里的事情。"
        list_intro: "在以下情境下可能会有帮助："
        list:
          - "强烈的情绪让人感到难以承受"
          - "焦虑、低落或退缩"
          - "家庭变化——分居、新添手足、搬家"
          - "悲伤或丧失"
          - "交朋友或维系友谊有困难"

      - title: "亲子游戏治疗 (Filial Therapy)"
        sub: "在家中开展的亲子游戏时间"
        lead: "通过短期培训，让您可以在家中与孩子进行30分钟的治疗性游戏时间，并由我提供支持。"
        body: "亲子游戏治疗认识到父母是孩子生命中最重要的人。经过一段简短的培训（通常每周一次、持续数周），您在家中开展结构化的游戏时间，我在督导中支持您。许多家庭说，这是他们与孩子做过的最有连接感的事情。"
        list_intro: "家长常常告诉我："
        list:
          - "他们以新的方式理解自己的孩子"
          - "卡住已久的行为开始转变"
          - "日常的节奏变得更平和"
          - "作为家长，他们感到更有信心"

  process:
    eyebrow: "流程"
    title: "您可以期待的"
    lead: "从首次联系到首次复盘的四个步骤。真正的工作发生在游戏室里——以下是走到那里的轮廓。"
    steps:
      - title: "取得联系"
        body: "填写下方的咨询表。我会在三个工作日内回复，确定一次免费的15分钟电话时间。"
      - title: "家长初诊"
        body: "我们不带孩子在游戏室见面，了解孩子的历史和您的期待。预留约90分钟。"
      - title: "开始游戏治疗"
        body: "孩子每周来一次。前三到四次治疗专注于建立信任，并清晰地了解孩子的需要。"
      - title: "家长复盘"
        body: "在三到四次治疗之后我们会再次见面，分享观察到的情况并共同设定目标。之后每五周复盘一次。"

  about:
    eyebrow: "认识 Alisa"
    title: "Alisa Liao — 注册游戏治疗师"
    bio_html: >
      <p>Alisa 是一名注册游戏治疗师，为阿德莱德市区3-8岁的儿童及其家庭提供服务，同时也提供线上治疗。她在南澳大学接受训练，是澳大拉西亚太平洋游戏治疗协会 (APPTA) 与游戏治疗师执业协会 (PTPA) 的成员。</p>
      <p>在创办自己的诊所之前，Alisa 在儿童与家庭服务领域工作数年，支持家庭度过重大过渡期与养育子女的日常挑战。她把这种踏实、温暖、不做作的态度带进每一次游戏室的治疗。</p>
    credentials_title: "资历与注册"
    credentials:
      - what: "儿童游戏治疗研究生文凭"
        where: "南澳大学"
      - what: "社会工作学士"
        where: "阿德莱德大学"
      - what: "澳大拉西亚太平洋游戏治疗协会 (APPTA) 会员"
      - what: "游戏治疗师执业协会 (PTPA) 会员"
      - what: "澳大利亚社会工作者协会注册会员"

  faq:
    eyebrow: "常见问题"
    title: "FAQ"
    lead: "以下是家长们最常问到的问题。如果您的疑问不在其中，请在咨询表中一并提出，我会在回复时一并解答。"
    items:
      - q: "什么是游戏治疗？"
        a_html: >
          <p>游戏治疗是一种基于发展心理学的咨询方法，使用孩子的'母语'——游戏——帮助他们处理情绪、建立技能，并渡过困难的经历。</p>
          <p>孩子不需要为每一件事都找到词汇。训练有素的游戏治疗师可以通过孩子游戏的方式读懂他们在表达什么，并以此支持他们。</p>
      - q: "我的孩子需要来多久？"
        a: "大多数孩子每周一次，持续约12-20次治疗。在第4次治疗后的复盘时，我们会对所需时间有更清晰的判断。"
      - q: "您提供线上治疗吗？"
        a: "提供——主要针对家长咨询和亲子游戏治疗。儿童治疗需要面对面，因为很多工作是通过玩具和游戏室本身发生的。"
      - q: "您服务的年龄段是？"
        a: "3-8岁的儿童。一些方法在这个范围之外也适用；如果您的孩子年龄稍大，请与我联系，我们可以讨论是否合适。"
      - q: "您接受 NDIS 客户吗？"
        a: "接受——包括自我管理和计划管理两种。游戏治疗可在 '能力建设——改善日常生活' 项下报销。"
      - q: "如果孩子一开始不愿意来怎么办？"
        a: "这在最初非常常见，通常经过几次治疗后会稳定下来。任何出现的情况，我们都会在家长复盘时讨论。"

